<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FE0 Cipher - 同步对战版</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>
      document.addEventListener('dragstart', e => e.preventDefault(), { capture: true });
      // 阻止从屏幕左边缘向右划触发浏览器后退手势
      document.addEventListener('pointerdown', e => {
        if (e.clientX < 20) e.preventDefault();
      }, { capture: true, passive: false });
    </script>
    
    <!-- app.js handles all module imports -->

</head>
<body class="text-gray-200 select-none overflow-hidden h-screen">

<div id="app" class="h-full flex flex-col relative">

	<top-control-bar
        :is-dev-mode="isDevMode"
        :is-my-turn="isMyTurn"
     :show-dev-mode-toggle="!showAiReplayPanel"
        :on-toggle-dev-mode="toggleDevMode"
        :on-reset-game="resetByControlBar"
        :show-reset-button="topBarUi.showResetButton && !showAiReplayPanel"
        :on-open-deck-manager="openDeckManager"
        :show-deck-manager-button="topBarUi.showDeckManagerButton && !showAiReplayPanel"
        :on-run-ai-duel="runAiDuelFromControlBar"
        :on-open-ai-replay="openAiReplayFromControlBar"
        :on-toggle-ai-replay-panel-hidden="toggleAiReplayPanelHiddenFromControlBar"
        :on-ai-replay-prev="stepAiReplayPrev"
        :on-ai-replay-next="stepAiReplayNext"
        :on-exit-ai-replay-mode="closeAiReplayPanel"
        :show-ai-duel-button="isDevMode && !showAiReplayPanel"
        :show-ai-replay-button="isDevMode && !showAiReplayPanel"
        :show-ai-replay-panel-toggle="isDevMode && showAiReplayPanel"
        :show-ai-replay-exit-button="isDevMode && showAiReplayPanel"
        :ai-replay-panel-hidden="isAiReplayPanelHidden"
        :show-ai-replay-step-buttons="showAiReplayStepButtons"
        :can-ai-replay-prev="canStepAiReplayPrev"
        :can-ai-replay-next="canStepAiReplayNext"
        :show-ai-replay-current-line="showAiReplayStepButtons"
        :ai-replay-current-line="currentAiReplayEventLine"
        :ai-duel-pending="isAiDuelPending"
        :show-cost-counter="topBarUi.showCostCounter && !showAiReplayPanel"
        :remaining-cost="remainingCost"
        :total-bonds="totalBonds"
        :show-turn-owner="topBarUi.showTurnOwner && !showAiReplayPanel"
        :has-undo="!showAiReplayPanel && topBarUi.showResetButton && undoStack.length > 0"
        :undo-disabled="hasBattledThisTurn"
        :on-undo="undoLastMove"
        :phase-name="currentPhaseName"
        :show-phase-name="topBarUi.showPhaseName && !showAiReplayPanel"
        :show-next-phase-button="topBarUi.showNextPhaseButton && !showAiReplayPanel"
        :next-phase-label="nextPhaseLabel"
        :on-next-phase="nextPhase"
        :room-status-text="roomStatusText"
        :show-room-status-text="!showAiReplayPanel"
        :show-create-room-button="topBarUi.showCreateRoomButton && !showAiReplayPanel"
        :on-create-room="createRoom"
        :show-join-room-button="topBarUi.showJoinRoomButton && !showAiReplayPanel"
        :on-join-room="joinRoom"
        :show-quick-match-button="topBarUi.showQuickMatchButton && !showAiReplayPanel"
        :on-quick-match="quickMatch"
        :show-leave-room-button="topBarUi.showLeaveRoomButton && !showAiReplayPanel"
        :on-leave-room="leaveRoom"
        :show-start-room-button="topBarUi.showStartRoomButton && !showAiReplayPanel"
        :room-can-start="canStartRoomGame"
        :on-start-room-game="startRoomGame">
    </top-control-bar>
	
    <div class="battle-container">
        <battle-row
            :cards="opponentRear"
            row-class="row-opp-rear"
            :is-enemy="true"
            :hovered-attack-target-id="hoveredAttackTargetId"
            :attack-range-target-ids="attackRangeTargetIds"
            :is-guide-active="false"
            :is-dragging-over="false"
            :set-dragging-over="setDraggingOver"
            :clear-dragging-over="clearDraggingOver"
            :on-drag-over="onDragOver"
            :on-drop-area="onDrop"
            :on-attack-drop="onAttackDrop"
            :on-card-click="handleMinifiedClick"
            :on-drag-start="onDragStart"
            :on-touch-start="onTouchStart"
            :on-touch-move="onTouchMove"
            :on-touch-end="onTouchEnd">
        </battle-row>

        <battle-row
            :cards="opponentFront"
            row-class="row-opp-front"
            :is-enemy="true"
            :hovered-attack-target-id="hoveredAttackTargetId"
            :attack-range-target-ids="attackRangeTargetIds"
            :is-guide-active="false"
            :is-dragging-over="false"
            :set-dragging-over="setDraggingOver"
            :clear-dragging-over="clearDraggingOver"
            :on-drag-over="onDragOver"
            :on-drop-area="onDrop"
            :on-attack-drop="onAttackDrop"
            :on-card-click="handleMinifiedClick"
            :on-drag-start="onDragStart"
            :on-touch-start="onTouchStart"
            :on-touch-move="onTouchMove"
            :on-touch-end="onTouchEnd">
        </battle-row>

        <battle-row
            :cards="fieldFront"
            row-class="row-my-front"
            area="front"
            area-label="Front"
            :is-enemy="false"
            :hovered-attack-target-id="hoveredAttackTargetId"
            :is-guide-active="currentPhase === 'DEPLOY' && !isDevMode"
            :is-dragging-over="isDraggingOver === 'front'"
            :set-dragging-over="setDraggingOver"
            :clear-dragging-over="clearDraggingOver"
            :on-drag-over="onDragOver"
            :on-drop-area="onDrop"
            :on-attack-drop="onAttackDrop"
            :on-card-click="handleMinifiedClick"
            :on-drag-start="onDragStart"
            :on-touch-start="onTouchStart"
            :on-touch-move="onTouchMove"
            :on-touch-end="onTouchEnd">
        </battle-row>

        <battle-row
            :cards="fieldRear"
            row-class="row-my-rear"
            area="rear"
            area-label="Rear"
            :is-enemy="false"
            :hovered-attack-target-id="hoveredAttackTargetId"
            :is-guide-active="currentPhase === 'DEPLOY' && !isDevMode"
            :is-dragging-over="isDraggingOver === 'rear'"
            :set-dragging-over="setDraggingOver"
            :clear-dragging-over="clearDraggingOver"
            :on-drag-over="onDragOver"
            :on-drop-area="onDrop"
            :on-attack-drop="onAttackDrop"
            :on-card-click="handleMinifiedClick"
            :on-drag-start="onDragStart"
            :on-touch-start="onTouchStart"
            :on-touch-move="onTouchMove"
            :on-touch-end="onTouchEnd">
        </battle-row>
    </div>
    <deck-widget
        :deck-count="deck?.length || 0"
        :on-draw-card="drawCard">
    </deck-widget>

    <div
        v-if="showAiReplayStepButtons"
        class="fixed right-2 sm:right-6 bottom-[72px] sm:bottom-[92px] z-[92] flex items-center gap-1.5">
        <button
            @click="stepAiReplayPrev()"
            :disabled="!canStepAiReplayPrev"
            :class="canStepAiReplayPrev ? 'bg-sky-900/85 hover:bg-sky-700 border-sky-500/50 text-white' : 'bg-sky-900/30 border-sky-900/60 text-sky-300/50 cursor-not-allowed'"
            class="text-[10px] px-2 py-1 rounded border">
            上一步
        </button>
        <button
            @click="stepAiReplayNext()"
            :disabled="!canStepAiReplayNext"
            :class="canStepAiReplayNext ? 'bg-sky-900/85 hover:bg-sky-700 border-sky-500/50 text-white' : 'bg-sky-900/30 border-sky-900/60 text-sky-300/50 cursor-not-allowed'"
            class="text-[10px] px-2 py-1 rounded border">
            下一步
        </button>
    </div>
    <div class="hand-container-fixed">
		<bond-strip
            :bonds="bonds"
            :current-phase="currentPhase"
            :has-placed-bond="hasPlacedBond"
            :is-dev-mode="isDevMode"
            :is-dragging-over="isDraggingOver"
            :get-card-faction-info="getCardFactionInfo"
            :set-dragging-over="setDraggingOver"
            :on-drop="onDrop"
            :on-open-panel="openBondsPanel"
            :on-select-card="selectCard">
        </bond-strip>

        <hand-strip
            :hand="hand"
            :is-dragging-over="isDraggingOver"
            :get-card-faction-info="getCardFactionInfo"
            :on-card-click="handleMinifiedClick"
            :on-touch-start="onTouchStart"
            :on-drag-start="onDragStart"
            :on-touch-move="onTouchMove"
            :on-touch-end="onTouchEnd">
        </hand-strip>
    </div>
    
    <side-panel-buttons
        mode="player"
        :items="playerPanelButtons"
        :on-open-panel="openPanel">
    </side-panel-buttons>

    <side-panel-buttons
        mode="enemy"
        :items="enemyPanelButtons"
        :on-open-panel="openPanel">
    </side-panel-buttons>

    <div
        v-if="hoveredAttackTargetRect"
        :class="['attack-target-screen-overlay', { 'attack-target-screen-overlay--mc': [...opponentFront, ...opponentRear].some(card => String(card.instanceId) === String(hoveredAttackTargetId) && card.isMainCharacter) }]"
        :style="{
            top: hoveredAttackTargetRect.top + 'px',
            left: hoveredAttackTargetRect.left + 'px',
            width: hoveredAttackTargetRect.width + 'px',
            height: hoveredAttackTargetRect.height + 'px'
        }">
    </div>

    <combat-overlay
        :is-combat-active="isCombatActive"
        :my-support-card="mySupportCard"
        :opp-support-card="oppSupportCard"
        :attacker="attacker"
        :defender="defender"
        :combat-stats="combatStats"
        :combat-decision="combatDecision"
        :cost-cards="combatCostCandidates"
        :selected-cost-card="selectedCombatCostCard"
        :selected-cost-card-name="selectedCombatCostCardName"
        :is-my-attacker="isMyCombatAttacker"
        :on-open-cost-picker="openCombatCostPicker"
        :on-combat-decision="handleCombatDecision">
    </combat-overlay>

    <region-panel
        :active-panel="activePanel"
        :panel-title="resolvedPanelTitle"
        :panel-cards="resolvedPanelCards"
        :is-dev-mode="isDevMode"
        :is-opponent-panel="isOpponentPanel"
        :on-close="closeActivePanel"
        :on-card-click="handleRegionPanelCardClick">
    </region-panel>

    <card-detail-modal
        :selected-card="selectedCard"
        :primary-action-label="selectedCardAbilityPrimaryLabel"
        :on-primary-action="onSelectedCardAbilityPrimary"
        :secondary-action-label="selectedCardAbilitySecondaryLabel"
        :on-secondary-action="onSelectedCardAbilitySecondary"
        :tertiary-action-label="selectedCardAbilityTertiaryLabel"
        :on-tertiary-action="onSelectedCardAbilityTertiary"
        :quaternary-action-label="selectedCardAbilityQuaternaryLabel"
        :on-quaternary-action="onSelectedCardAbilityQuaternary"
        :is-my-card="isMyCard"
        :is-card-in-hand="isCardInHand"
        :is-dev-mode="isDevMode"
        :is-my-turn="isMyTurn"
        :current-phase="currentPhase"
        :show-full-image="showFullImage"
        :formatted-ability="formattedAbility"
        :formatted-support="formattedSupport"
        :get-area-name="getAreaName"
        :get-area="getArea"
        :play-to-field="playToField"
        :play-to-bond="playToBond"
        :return-to-hand-from-board="returnToHandFromBoard"
        :untap-card="untapCard"
        :toggle-bond-face="toggleBondFace"
        :move-to="moveTo"
        :move-field-unit="moveFieldUnit"
        :can-perform-class-change="canPerformClassChange"
        :perform-class-change="performClassChange"
        :place-card-to-top-of-deck="placeCardToTopOfDeck"
        :on-close="closeSelectedCard"
        :on-open-full-image="openFullImage">
    </card-detail-modal>

    <opp-hand-panel
        :active-panel="activePanel"
        :opp-hand-cards="oppHand"
        :opp-hand-count="oppStats.hand"
        :is-dev-mode="isDevMode"
        :on-close="closeActivePanel">
    </opp-hand-panel>

    <opp-deck-panel
        :active-panel="activePanel"
        :opp-deck-cards="oppDeck"
        :is-dev-mode="isDevMode"
        :on-close="closeActivePanel">
    </opp-deck-panel>

    <deck-manager-modal
        :visible="showDeckManager"
        :on-close="closeDeckManager">
    </deck-manager-modal>

    <ai-replay-panel
        :visible="showAiReplayPanelVisible"
        :compact="isCompactMobile"
        :loading="isAiReplayLoading"
        :replay-log="aiReplayLog"
        :selected-game-index="aiReplayGameIndex"
        :cursor="aiReplayCursor"
        :on-close="closeAiReplayPanel"
        :on-load-latest="loadLatestAiReplayLog"
        :on-select-game="selectAiReplayGame"
        :on-step-prev="stepAiReplayPrev"
        :on-step-next="stepAiReplayNext"
        :on-jump-to="jumpAiReplayTo">
    </ai-replay-panel>

    <div v-if="showFullImage && selectedCard" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-2" @click="showFullImage = false">
        <img :src="selectedCard.image" class="max-w-full max-h-full object-contain animate-zoom">
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="shared/socketEvents.js"></script>
<script src="shared/rangeModel.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
